tools:
  - class_name: "verl.tools.search_tool.SearchTool"
    config:
      type: native
      retrieval_service_url: http://127.0.0.1:8000/retrieve
      topk: 3
      timeout: 60
      max_concurrency: 128
    tool_schema:
      type: function
      function:
        name: search
        description: Search a Wikipedia corpus for passages relevant to the query.
        parameters:
          type: object
          properties:
            query:
              type: string
              description: A fully-formed search query.
          required: ["query"]
